apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    io.kompose.service: postgres-media-db
  name: postgres-media-db
  namespace: studyhub-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: postgres-media-db
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        io.kompose.service: postgres-media-db
    spec:
      containers:
        - env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_DB
              value: media_service_db
            - name: POSTGRES_PASSWORD
              value: password
            - name: POSTGRES_USER
              value: user
          image: postgres:16-alpine
          name: postgres-media-db
          ports:
            - containerPort: 5432
              protocol: TCP
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: postgres-media-data
      restartPolicy: Always
      volumes:
        - name: postgres-media-data
          persistentVolumeClaim:
            claimName: postgres-media-data
