apiVersion: apps/v1
kind: Deployment
metadata:
  name: media-service
  namespace: studyhub-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: media-service
  template:
    metadata:
      labels:
        app: media-service
    spec:
      containers:
        - name: media-service
          image: gnuhhung317/studyhub-media-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: studyhub-config
            - secretRef:
                name: studyhub-secrets
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres-shared-db:5432/media_service_db
            - name: SPRING_DATASOURCE_USERNAME
              value: user
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: studyhub-secrets
                  key: DB_PASSWORD
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: "http://keycloak:8080/realms/master"
          # readinessProbe:
          #   httpGet:
          #     path: /actuator/health/readiness
          #     port: 8084
          #   initialDelaySeconds: 30
          #   periodSeconds: 10
          # livenessProbe:
          #   httpGet:
          #     path: /actuator/health/liveness
          #     port: 8084
          #   initialDelaySeconds: 60
          #   periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: media-service
  namespace: studyhub-dev
spec:
  selector:
    app: media-service
  ports:
    - protocol: TCP
      port: 8084
      targetPort: 8084
