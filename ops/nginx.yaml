---
# nginx-deploy.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-nginx
  namespace: studyhub-dev
spec:
  replicas: 1
  selector:
    matchLabels: { app: edge-nginx }
  template:
    metadata:
      labels: { app: edge-nginx }
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80    # HTTP redirect
            - containerPort: 443   # HTTPS keycloak
            - containerPort: 9443  # HTTPS minio console
            - containerPort: 9441  # HTTPS zipkin
            - containerPort: 5432   # pg user
            - containerPort: 5433   # pg chat
            - containerPort: 5672   # amqp
            - containerPort: 6379   # redis
            - containerPort: 9000   # minio s3
            - containerPort: 15672  # rabbitmq ui
            - containerPort: 18080  # status
          volumeMounts:
            - name: nginx-conf
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
            - name: nginx-crt
              mountPath: /etc/nginx/nginx.crt
              subPath: nginx.crt
            - name: nginx-key
              mountPath: /etc/nginx/nginx.key
              subPath: nginx.key
          readinessProbe:
            httpGet:
              path: /nginx_status
              port: 18080
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /nginx_status
              port: 18080
            initialDelaySeconds: 15
            periodSeconds: 10
      volumes:
        - name: nginx-conf
          configMap:
            name: edge-nginx-conf
            items:
              - key: nginx.conf
                path: nginx.conf
        - name: nginx-crt
          configMap:
            name: edge-nginx-conf
            items:
              - key: nginx.crt
                path: nginx.crt
        - name: nginx-key
          configMap:
            name: edge-nginx-conf
            items:
              - key: nginx.key
                path: nginx.key
---
# nginx-svc.yaml
apiVersion: v1
kind: Service
metadata:
  name: edge
  namespace: studyhub-dev
  annotations:
    # ví dụ: trên cloud bạn có thể thêm annotation của provider (tùy môi trường)
    # service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  loadBalancerIP: 203.0.113.42
  selector:
    app: edge-nginx
  ports:
    - name: http
      port: 80
      targetPort: 80
    - name: https-keycloak
      port: 443
      targetPort: 443
    - name: https-minio-console
      port: 9443
      targetPort: 9443
    - name: https-zipkin
      port: 9441
      targetPort: 9441
    - name: pg-user
      port: 5432
      targetPort: 5432
    - name: pg-chat
      port: 5433
      targetPort: 5433
    - name: amqp
      port: 5672
      targetPort: 5672
    - name: redis
      port: 6379
      targetPort: 6379
    - name: minio-api
      port: 9000
      targetPort: 9000
    - name: rabbit-ui
      port: 15672
      targetPort: 15672
