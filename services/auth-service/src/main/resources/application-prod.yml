server:
  port: 8082

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://postgres-auth-db:5432/auth_service_db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/master

eureka:
  client:
    enabled: false

keycloak:
  server-url: http://keycloak:8080
  realm: master
  admin-user: admin
  admin-password: admin
  client-id: admin-cli
  client-secret: tMMZKCDwl8LVIwuTGTZhqmbv9tLB1s13
