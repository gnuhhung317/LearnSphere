server:
  port: 8085
spring:
  application:
    name: realtime-service
  datasource:
    url: jdbc:postgresql://localhost:5432/realtime_service_db
    driver-class-name: org.postgresql.Driver
    username: user
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak.studyhub.local/realms/master
          jwk-set-uri: http://keycloak.studyhub.local/realms/master/protocol/openid-connect/certs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.studyhub.realtime_service: DEBUG
    org.springframework.web.socket: DEBUG

