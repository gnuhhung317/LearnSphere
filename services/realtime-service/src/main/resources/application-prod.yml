server:
  port: 8085

spring:
  application:
     name: realtime-service
  datasource:
    url: jdbc:postgresql://postgres-realtime-db:5432/realtime_service_db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/master
  
  kafka:
    bootstrap-servers: kafka:9092

eureka:
  client:
    enabled: false

livekit:
  url: ${LIVEKIT_URL:https://studhub-dev-xpq8abrl.livekit.cloud}
  api-key: ${LIVEKIT_API_KEY}
  api-secret: ${LIVEKIT_API_SECRET}
