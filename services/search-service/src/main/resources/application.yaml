server:
  port: 8087


spring:
  application:
    name: search-service
  datasource:
    url: jdbc:postgresql://localhost:5432/search_service_db
    driver-class-name: org.postgresql.Driver
    username: user
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak.studyhub.local/realms/master
  kafka:
    bootstrap-servers: localhost:9094
    consumer:
      group-id: search-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: "com.studyhub.learningservice.event.LearningSpaceCreatedEvent:com.studyhub.search_service.event.LearningSpaceCreatedEvent,com.studyhub.learningservice.event.ResourceAddedEvent:com.studyhub.search_service.event.ResourceAddedEvent,com.studyhub.chat_service.event.RoomCreatedEvent:com.studyhub.search_service.event.RoomCreatedEvent,com.studyhub.chat_service.event.UserJoinedRoomEvent:com.studyhub.search_service.event.UserJoinedRoomEvent"


eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka:eureka@localhost:8761/eureka/
