server:
  port: 8084

spring:
  application:
    name: media-service
  datasource:
    url: jdbc:postgresql://localhost:5432/media_service_db
    driver-class-name: org.postgresql.Driver
    username: user
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak.studyhub.local/realms/master
  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

minio:
  endpoint: http://minio-api.studyhub.local
  accessKey: minioadmin
  secretKey: minioadmin
  bucket: media

media:
  base-url: http://localhost:8084

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka:eureka@localhost:8761/eureka/
