server:
  port: 8084

spring:
  application:
    name: media-service
  datasource:
    url: jdbc:postgresql://postgres-media-db:5432/media_service_db
    username: user
    password: password
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://keycloak:8080/realms/master 

minio:
  url: http://minio:9000
  accessKey: minioadmin
  secretKey: minioadmin
  bucket: studyhub-media

eureka:
  client:
    enabled: false
